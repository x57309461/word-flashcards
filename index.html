<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻卡记单词</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fff;
      color: #333;
    }
    .word {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .phonetic {
      font-size: 16px;
      color: #888;
      margin-bottom: 24px;
    }
    .meaning {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 24px;
      display: none;
    }
    .meaning.show { display: block; }
    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      width: 100%;
    }
    .btn-group {
      display: none;
      gap: 12px;
    }
    .btn-group.show { display: flex; }
    .btn-known { background: #16a34a; color: #fff; flex: 1; }
    .btn-unknown { background: #dc2626; color: #fff; flex: 1; }
    .progress {
      font-size: 14px;
      color: #999;
      margin-top: 20px;
    }
    .done { font-size: 20px; color: #16a34a; font-weight: 600; }
    .back {
      font-size: 14px;
      color: #2563eb;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 选择界面 -->
    <div id="picker">
      <select id="stageSelect">
        <option value="">选择阶段...</option>
      </select>
      <select id="bookSelect">
        <option value="">选择词书...</option>
      </select>
      <button class="btn btn-primary" onclick="startLearning()">开始学习</button>
    </div>

    <!-- 翻卡界面 -->
    <div id="content" style="display:none;">
      <div class="word" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="meaning" id="meaning"></div>
      <button class="btn btn-primary" id="showBtn" onclick="showMeaning()">显示释义</button>
      <div class="btn-group" id="btnGroup">
        <button class="btn btn-known" onclick="markKnown()">认识</button>
        <button class="btn btn-unknown" onclick="markUnknown()">不认识</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="back" onclick="backToPicker()">← 返回选择</div>
    </div>
  </div>

  <script>
    let allWordbooks = [];
    let currentWordbookId = null;
    let words = [];
    let currentIndex = 0;

    // 加载词书列表
    async function loadWordbooks() {
      const res = await fetch('/api/wordbooks');
      const data = await res.json();
      allWordbooks = data.wordbooks || [];

      // 提取所有阶段（去重）
      const stages = [...new Set(allWordbooks.map(w => w.stage))];
      const stageSelect = document.getElementById('stageSelect');
      stages.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        stageSelect.appendChild(opt);
      });
    }

    // 选择阶段后，填充词书下拉框
    document.getElementById('stageSelect').addEventListener('change', (e) => {
      const stage = e.target.value;
      const bookSelect = document.getElementById('bookSelect');
      bookSelect.innerHTML = '<option value="">选择词书...</option>';

      if (!stage) return;

      allWordbooks
        .filter(w => w.stage === stage)
        .forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.id;
          opt.textContent = w.name;
          bookSelect.appendChild(opt);
        });
    });

    // 开始学习
    function startLearning() {
      const bookId = document.getElementById('bookSelect').value;
      if (!bookId) {
        alert('请先选择阶段和词书');
        return;
      }
      currentWordbookId = Number(bookId);
      document.getElementById('picker').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      loadWords();
    }

    // 返回选择界面
    function backToPicker() {
      document.getElementById('picker').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      words = [];
      currentIndex = 0;
    }

    function getKnownWords() {
      const raw = localStorage.getItem(`known_words_${currentWordbookId}`);
      return raw ? JSON.parse(raw) : [];
    }

    function saveKnownWord(word) {
      const known = getKnownWords();
      if (!known.includes(word)) {
        known.push(word);
        localStorage.setItem(`known_words_${currentWordbookId}`, JSON.stringify(known));
      }
    }

    async function loadWords() {
      const res = await fetch(`/api/words?wordbook_id=${currentWordbookId}`);
      const data = await res.json();

      const known = getKnownWords();
      words = data.words.filter(w => !known.includes(w.word));

      if (words.length === 0) {
        document.getElementById('content').innerHTML =
          '<div class="done">🎉 全部学完！</div><div class="back" onclick="backToPicker()">← 返回选择</div>';
        return;
      }

      currentIndex = 0;
      renderWord();
    }

    function renderWord() {
      if (currentIndex >= words.length) {
        document.getElementById('content').innerHTML =
          '<div class="done">🎉 本轮学完！</div><div class="back" onclick="backToPicker()">← 返回选择</div>';
        return;
      }

      const w = words[currentIndex];
      document.getElementById('word').textContent = w.word;
      document.getElementById('phonetic').textContent = w.phonetic ? `/${w.phonetic}/` : '';
      document.getElementById('meaning').textContent = w.meaning || '';
      document.getElementById('meaning').classList.remove('show');
      document.getElementById('showBtn').style.display = 'block';
      document.getElementById('btnGroup').classList.remove('show');
      document.getElementById('progress').textContent =
        `${currentIndex + 1} / ${words.length}`;
    }

    function showMeaning() {
      document.getElementById('meaning').classList.add('show');
      document.getElementById('showBtn').style.display = 'none';
      document.getElementById('btnGroup').classList.add('show');
    }

    function markKnown() {
      saveKnownWord(words[currentIndex].word);
      currentIndex++;
      renderWord();
    }

    function markUnknown() {
      currentIndex++;
      renderWord();
    }

    loadWordbooks();
  </script>
</body>
</html>
