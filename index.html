<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻卡记单词</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fff;
      color: #333;
    }
    .word {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .phonetic {
      font-size: 16px;
      color: #888;
      margin-bottom: 24px;
    }
    .meaning {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 24px;
      display: none;
    }
    .meaning.show { display: block; }
    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #2563eb;
      color: #fff;
      width: 100%;
    }
    .btn-group {
      display: none;
      gap: 12px;
    }
    .btn-group.show { display: flex; }
    .btn-known { background: #16a34a; color: #fff; flex: 1; }
    .btn-unknown { background: #dc2626; color: #fff; flex: 1; }
    .progress {
      font-size: 14px;
      color: #999;
      margin-top: 20px;
    }
    .done { font-size: 20px; color: #16a34a; font-weight: 600; }
    .back {
      font-size: 14px;
      color: #2563eb;
      cursor: pointer;
      margin-top: 16px;
    }
    .loading { font-size: 16px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div id="picker">
      <select id="stageSelect">
        <option value="">选择阶段...</option>
      </select>
      <select id="bookSelect">
        <option value="">选择词书...</option>
      </select>
      <button class="btn btn-primary" onclick="startLearning()">开始学习</button>
    </div>

    <div id="content" style="display:none;">
      <div class="word" id="word"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="meaning" id="meaning"></div>
      <button class="btn btn-primary" id="showBtn" onclick="showMeaning()">显示释义</button>
      <div class="btn-group" id="btnGroup">
        <button class="btn btn-known" onclick="markKnown()">认识</button>
        <button class="btn btn-unknown" onclick="markUnknown()">不认识</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="back" onclick="backToPicker()">← 返回选择</div>
    </div>
  </div>

  <script type="module">
    import { FSRS, Rating, createEmptyCard } from 'https://esm.sh/ts-fsrs@4.5.0';

    const fsrs = new FSRS();

    let allWordbooks = [];
    let currentWordbookId = null;
    let words = [];
    let currentIndex = 0;
    let currentCard = null;

    // ===== 加载词书列表 =====
    async function loadWordbooks() {
      const res = await fetch('/api/wordbooks');
      const data = await res.json();
      allWordbooks = data.wordbooks || [];

      const stages = [...new Set(allWordbooks.map(w => w.stage))];
      const stageSelect = document.getElementById('stageSelect');
      stages.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        stageSelect.appendChild(opt);
      });
    }

    // ===== 阶段变化 → 填充词书下拉框 =====
    document.getElementById('stageSelect').addEventListener('change', (e) => {
      const stage = e.target.value;
      const bookSelect = document.getElementById('bookSelect');
      bookSelect.innerHTML = '<option value="">选择词书...</option>';
      if (!stage) return;

      allWordbooks
        .filter(w => w.stage === stage)
        .forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.id;
          opt.textContent = w.name;
          bookSelect.appendChild(opt);
        });
    });

    // ===== 开始学习 =====
    async function startLearning() {
      const bookId = document.getElementById('bookSelect').value;
      if (!bookId) { alert('请先选择阶段和词书'); return; }
      currentWordbookId = Number(bookId);
      document.getElementById('picker').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('content').innerHTML = '<div class="loading">加载中...</div>';
      await loadDueWords();
    }

    // ===== 加载今日待复习单词 =====
    async function loadDueWords() {
      // 恢复 content 的初始结构
      document.getElementById('content').innerHTML = `
        <div class="word" id="word"></div>
        <div class="phonetic" id="phonetic"></div>
        <div class="meaning" id="meaning"></div>
        <button class="btn btn-primary" id="showBtn" onclick="showMeaning()">显示释义</button>
        <div class="btn-group" id="btnGroup">
          <button class="btn btn-known" onclick="markKnown()">认识</button>
          <button class="btn btn-unknown" onclick="markUnknown()">不认识</button>
        </div>
        <div class="progress" id="progress"></div>
        <div class="back" onclick="backToPicker()">← 返回选择</div>
      `;

      const res = await fetch(`/api/due?wordbook_id=${currentWordbookId}`);
      const data = await res.json();
      words = data.words || [];

      if (words.length === 0) {
        document.getElementById('content').innerHTML =
          '<div class="done">🎉 今日复习完成！</div><div class="back" onclick="backToPicker()">← 返回选择</div>';
        return;
      }

      currentIndex = 0;
      renderWord();
    }

    // ===== 渲染当前单词 =====
    function renderWord() {
      if (currentIndex >= words.length) {
        document.getElementById('content').innerHTML =
          '<div class="done">🎉 本轮完成！</div><div class="back" onclick="backToPicker()">← 返回选择</div>';
        return;
      }

      const w = words[currentIndex];

      if (w.due) {
        currentCard = {
          due: new Date(w.due),
          stability: w.stability || 0,
          difficulty: w.difficulty || 0,
          elapsed_days: 0,
          scheduled_days: 0,
          reps: w.reps || 0,
          state: w.state || 0,
          last_review: w.last_review ? new Date(w.last_review) : new Date(),
        };
      } else {
        currentCard = createEmptyCard();
      }

      document.getElementById('word').textContent = w.word;
      document.getElementById('phonetic').textContent = w.phonetic ? `/${w.phonetic}/` : '';
      document.getElementById('meaning').textContent = w.meaning || '';
      document.getElementById('meaning').classList.remove('show');
      document.getElementById('showBtn').style.display = 'block';
      document.getElementById('btnGroup').classList.remove('show');
      document.getElementById('progress').textContent =
        `${currentIndex + 1} / ${words.length}`;
    }

    // ===== 显示释义 =====
    function showMeaning() {
      document.getElementById('meaning').classList.add('show');
      document.getElementById('showBtn').style.display = 'none';
      document.getElementById('btnGroup').classList.add('show');
    }

    // ===== 认识 / 不认识 =====
    async function markKnown() { await reviewCurrentWord(Rating.Good); }
    async function markUnknown() { await reviewCurrentWord(Rating.Again); }

    // ===== FSRS 调度 + 保存 =====
    async function reviewCurrentWord(rating) {
      try {
        const now = new Date();
        const scheduling = fsrs.repeat(currentCard, now);
        const result = scheduling[rating];
        const updatedCard = result.card;

        await fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            wordId: words[currentIndex].id,
            rating: rating,
            due: updatedCard.due.toISOString(),
            stability: updatedCard.stability,
            difficulty: updatedCard.difficulty,
            reps: updatedCard.reps,
            state: updatedCard.state,
          }),
        });

        currentCard = updatedCard;
        currentIndex++;
        renderWord();
      } catch (err) {
        console.error('复习保存失败:', err);
        alert('保存失败，请检查网络或控制台');
      }
    }

    // ===== 返回选择 =====
    function backToPicker() {
      document.getElementById('picker').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      words = [];
      currentIndex = 0;
      currentCard = null;
    }

    // ===== 挂到 window（因为 module 作用域不是全局） =====
    Object.assign(window, {
      startLearning, backToPicker, showMeaning, markKnown, markUnknown
    });

    // ===== 初始化 =====
    loadWordbooks();
  </script>
</body>
</html>
